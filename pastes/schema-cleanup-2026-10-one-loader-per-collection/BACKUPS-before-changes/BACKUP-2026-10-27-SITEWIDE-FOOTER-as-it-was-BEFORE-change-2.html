<!-- ===============================
 Suppress Squarespace Microdata — v1.7 HARD STRIP (Nov 2025)
 Purpose: Fully remove Squarespace duplicate microdata before crawl
 =============================== -->
<script>
(function(){
  const killAttrs = el=>{
    ['itemtype','itemprop','itemscope','itemid'].forEach(a=>el.removeAttribute(a));
  };
  const purge = ()=>{
    document.querySelectorAll('[itemscope],[itemtype],[itemprop],[itemid]').forEach(killAttrs);
  };
  // run early, then twice more post-hydration
  purge();
  document.addEventListener('DOMContentLoaded', purge);
  window.addEventListener('load', ()=>setTimeout(purge, 800));
  // catch dynamic SSR hydration loops every 2 s for 6 s total
  let t=0; const interval=setInterval(()=>{purge(); if(++t>3) clearInterval(interval);},2000);
})();
</script>
<!-- =============================== END Microdata Suppression v1.7 =============================== -->

<!-- ARP Blog Schema Loader v5.1 — loads JSON for blog posts, skips FAQ injection -->
<script>
(function () {
  try {
    var path = window.location && window.location.pathname ? window.location.pathname : "";
    // Only run on blog articles
    if (!/\/blog-on-photography\//.test(path)) return;

    // Strip trailing slash and get last segment as slug
    path = path.replace(/\/+$/, "");
    var slug = path.split("/").pop();
    if (!slug) return;

    var baseUrl = "https://schema.alanranger.com/";

    // Do NOT include "breadcrumb" unless the generator actually creates that file
    var kinds = ["schema", "blogposting", "image", "howto", "faq", "breadcrumb", "person"];

    function injectJson(kind, data) {
      var id = "arp-schema-" + slug + "-" + kind;
      if (document.getElementById(id)) return;

      // Special rule: DO NOT inject FAQ JSON-LD into the DOM.
      // This prevents duplicate FAQPage because Google crawls the public JSON file as well.
      if (kind === "faq") {
        // Keep data available for diagnostics if needed
        window.ARP_FAQ_DATA = data;
        return; // skip DOM injection
      }

      // Normal injection for all other schema types
      var script = document.createElement("script");
      script.type = "application/ld+json";
      script.id = id;
      try {
        script.text = JSON.stringify(data);
      } catch (e) {
        return;
      }
      document.head.appendChild(script);
    }

    kinds.forEach(function (kind) {
      var url = baseUrl + slug + "_" + kind + ".json";

      // Use fetch if available; silently ignore 404s or errors
      if (window.fetch) {
        fetch(url, { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (json) {
            injectJson(kind, json);
          })
          .catch(function () {
            // No file for this kind / network issue – ignore
          });
      } else {
        // Legacy fallback using XHR
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status >= 200 && xhr.status < 300) {
              try {
                var json = JSON.parse(xhr.responseText);
                injectJson(kind, json);
              } catch (e) {}
            }
          };
          xhr.send();
        } catch (e) {}
      }
    });
  } catch (e) {
    // Swallow any unexpected errors so we never break the page
  }
})();
</script>




<!-- Block Squarespace-injected Product schemas only -->
<script>
(function () {
  const removeProductSchema = () => {
    const scripts = document.querySelectorAll('script[type="application/ld+json"]');

    scripts.forEach((script) => {
      try {
        const json = JSON.parse(script.textContent);

        if (
          json['@type'] === 'Product' ||
          (Array.isArray(json['@type']) && json['@type'].includes('Product'))
        ) {
          // Optional safety: only remove if there's no review/aggregateRating
          const hasReviewData = json.review || json.aggregateRating;
          if (!hasReviewData) {
            script.remove();
          }
        }
      } catch (e) {
        // Ignore malformed scripts
      }
    });
  };

  // Run once on DOM ready
  document.addEventListener("DOMContentLoaded", removeProductSchema);

  // Run continuously for any future injections
  const observer = new MutationObserver(() => {
    removeProductSchema();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
</script>

<!-- Accordion Icons Reliability Fix — 2025-11-05 (body-safe version) -->
<script>
(function(){
  function replaceAccordionIcons(){
    var icons = window.accordionIcons || [];
    if(!icons.length) return;
    var roots = document.querySelectorAll(
      '.sqs-block-accordion, .accordion-block, .accordion, .accordion-item'
    );
    if(!roots.length) return;

    roots.forEach(function(root){
      if(root.__iconsApplied) return;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode:function(node){
          if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if(node.parentElement && node.parentElement.classList.contains('accordion-icon'))
            return NodeFilter.FILTER_REJECT;
          return /\[[a-z0-9\-]+-icon\]/i.test(node.nodeValue)
            ? NodeFilter.FILTER_ACCEPT
            : NodeFilter.FILTER_REJECT;
        }
      });
      var toProcess=[];
      while(walker.nextNode()) toProcess.push(walker.currentNode);

      toProcess.forEach(function(textNode){
        var original=textNode.nodeValue, replaced=original;
        for(var i=0;i<icons.length;i++){
          var key=icons[i].text, svg=icons[i].svg;
          if(replaced.indexOf(key)!==-1){
            replaced=replaced.split(key).join(svg);
          }
        }
        if(replaced!==original){
          var span=document.createElement('span');
          span.className='accordion-icon';
          span.innerHTML=replaced;
          textNode.parentNode.replaceChild(span,textNode);
        }
      });
      root.__iconsApplied=true;
    });
  }

  function safeRun(){
    try{ replaceAccordionIcons(); }catch(e){} 
  }

  function startWhenReady(){
    if(!document.body){ setTimeout(startWhenReady, 150); return; }
    safeRun();
    window.addEventListener('load', safeRun);
    [500,1200,2500,4000].forEach(function(t){ setTimeout(safeRun,t); });

    // MutationObserver (now guaranteed valid)
    try{
      var mo=new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){
          if(muts[i].addedNodes && muts[i].addedNodes.length){ safeRun(); break; }
        }
      });
      mo.observe(document.body,{childList:true,subtree:true});
    }catch(e){}
  }

  startWhenReady();
})();
</script>

    setTimeout(function(){ withMemberstack(cb, tries + 1); }, 100);
  }

  function markLastGood(p) {
    if (p.indexOf("/academy/") !== 0) return;
    if (p === "/academy/login" || p === "/academy/trial-expired" || p === "/academy/upgrade") return;
    if (p === "/academy/undefined") return;
    try { localStorage.setItem(LS_LAST_GOOD, p); } catch (e) {}
  }

  function getLastGood() {
    try { return localStorage.getItem(LS_LAST_GOOD) || ""; } catch (e) { return ""; }
  }

  function seenMemberFlag() {
    try { return localStorage.getItem(LS_SEEN_MEMBER) === "1"; } catch (e) { return false; }
  }

  function setSeenMemberFlag() {
    try { localStorage.setItem(LS_SEEN_MEMBER, "1"); } catch (e) {}
  }

  function recoverUndefinedFast() {
    setHoldClass(true);
    setAcademyClass(false);
    removePill();

    var lastGood = getLastGood();
    if (lastGood && lastGood.indexOf("/academy/") === 0 && lastGood !== "/academy/undefined") {
      location.replace(lastGood);
      return;
    }
    if (seenMemberFlag()) location.replace("/academy/dashboard");
    else location.replace("/academy/login");
  }

  function stripeSafeLoginMode() {
    setAcademyClass(false);
    removePill();

    withMemberstack(function(ms){
      ms.getCurrentMember()
        .then(function(member){
          if (member && member.data) {
            setSeenMemberFlag();
            location.replace("/academy/dashboard");
          }
        })
        .catch(function(){});
    });
  }

  function apply() {
    var p = normPath();

    if (p === "/undefined" || p === "/academy/undefined") {
      recoverUndefinedFast();
      return;
    }

    setHoldClass(false);

    if (p === "/academy/login") {
      stripeSafeLoginMode();
      return;
    }

    if (p === "/academy/trial-expired") {
      setAcademyClass(false);
      removePill();
      return;
    }

    if (p === "/academy/upgrade") {
      setAcademyClass(false);
      removePill();
      return;
    }

    var onApp = isAcademyAppPage(p);
    setAcademyClass(onApp);

    if (onApp) {
      withMemberstack(function(ms){
        ms.getCurrentMember()
          .then(function(member){
            if (member && member.data) {
              setSeenMemberFlag();
              markLastGood(p);
            } else {
              location.replace("/academy/login");
            }
          })
          .catch(function(){
            location.replace("/academy/login");
          });
      });
    }

    if (p === "/academy/dashboard") {
      ensurePill();
      markLastGood(p);
    } else {
      removePill();
      if (p.indexOf("/academy/") === 0) markLastGood(p);
    }
  }

  apply();
  setTimeout(apply, 400);

  var lastPath = normPath();
  setInterval(function(){
    var now = normPath();
    if (now !== lastPath) {
      lastPath = now;
      apply();
    }
  }, 250);

  window.addEventListener("popstate", function(){ setTimeout(apply, 0); });
})();
</script>

<!-- ===========================
AR | MEMBERSTACK HISTORY TRACKER (SITE-WIDE) — v1.1 (KEEP DUPLICATES)
WHAT IT DOES:
- If a member is logged in, stores their last 5 visited pages into Memberstack Member JSON: json.history[]
- Keeps duplicates so the history reflects actual visits in order.
=========================== -->

<script>
(function(){
  async function waitForMS(){
    for(let i=0;i<60;i++){
      if(window.$memberstackDom) return window.$memberstackDom;
      await new Promise(r=>setTimeout(r,200));
    }
    return null;
  }

  function cleanTitle(){
    return (document.title || '').split('—')[0].trim() || 'Page';
  }

  function cleanUrl(){
    // Keep query so different filtered views are distinct; do not include origin.
    return window.location.pathname + window.location.search;
  }

  async function run(){
    const ms = await waitForMS();
    if(!ms) return;

    const res = await ms.getCurrentMember();
    if(!res || !res.data) return; // not logged in

    const jsonRes = await ms.getMemberJSON();
    const memberJson = (jsonRes && jsonRes.data) ? jsonRes.data : {};
    let history = Array.isArray(memberJson.history) ? memberJson.history : [];

    const currentPage = {
      title: cleanTitle(),
      url: cleanUrl(),
      date: new Date().toISOString()
    };

    // Keep duplicates: do NOT de-dupe by url.
    history.unshift(currentPage);
    history = history.slice(0, 5);

    await ms.updateMemberJSON({
      json: { ...memberJson, history }
    });
  }

  window.addEventListener('load', () => setTimeout(run, 500));
})();
</script>

<style>
  /* Modal sizing + scroll */
  #ar-search-modal{
    width: min(980px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    border: 0;

  #ar-search-modal::backdrop{ background: rgba(0,0,0,.45); }

  .ar-search-modal-head{
    display:flex; align-items:center; justify-content:space-between;

  .ar-search-modal-title{ font-size: 18px; font-weight: 700; margin: 0; }
  .ar-search-modal-close{
    appearance:none; border:0; background:transparent; cursor:pointer;
    font-size: 22px; line-height: 1; padding: 6px 10px;
  }

  /* Key part: body scrolls, dialog doesn't */
  .ar-search-modal-body{
    background:#fff;
    padding: 14px 16px 18px;
    overflow: auto;
    max-height: calc(100vh - 32px - 56px); /* viewport - margins - header */
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  /* When modal open: lock page scroll */
  html.ar-modal-open, body.ar-modal-open{
    overflow: hidden !important;
    height: 100% !important;
  }
</style>

<script>
(function(){
  if (window.__AR_SEARCH_MODAL_V2_INSTALLED__) return;
  window.__AR_SEARCH_MODAL_V2_INSTALLED__ = true;

  var ASSET_BASE = "https://alan-chat-proxy.vercel.app";
  var CSS_URL = ASSET_BASE + "/ar-site-search.css";
  var JS_URL  = ASSET_BASE + "/ar-site-search.js";

  var MODAL_ID = "ar-search-modal";
  var ROOT_ID  = "ar-search-modal-root";

  function loadCssOnce(){
    if (document.querySelector('link[data-ar-site-search-css="1"]')) return;
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = CSS_URL;
    link.setAttribute("data-ar-site-search-css", "1");
    document.head.appendChild(link);
  }

  function loadJsOnce(cb){
    if (window.ARSiteSearch && typeof window.ARSiteSearch.mount === "function") { cb(); return; }
    if (document.querySelector('script[data-ar-site-search-js="1"]')) {
      // already loading; poll
      var t0 = Date.now();
      (function wait(){
        if (window.ARSiteSearch && typeof window.ARSiteSearch.mount === "function") return cb();
        if (Date.now() - t0 > 6000) return cb(new Error("ARSiteSearch.mount not available"));
        setTimeout(wait, 50);
      })();
      return;
    }

    var s = document.createElement("script");
    s.src = JS_URL;
    s.defer = true;
    s.setAttribute("data-ar-site-search-js", "1");
    s.onload = function(){ cb(); };
    s.onerror = function(){ cb(new Error("Failed to load " + JS_URL)); };
    document.head.appendChild(s);
  }

  function ensureModal(){
    var d = document.getElementById(MODAL_ID);
    if (d) return d;

    d = document.createElement("dialog");
    d.id = MODAL_ID;
    d.innerHTML =
      '<div class="ar-search-modal-head">' +
        '<div class="ar-search-modal-title">Search</div>' +
        '<button class="ar-search-modal-close" type="button" aria-label="Close">×</button>' +
      '</div>' +
      '<div class="ar-search-modal-body">' +
        '<div id="'+ROOT_ID+'" class="ar-site-search"></div>' +
      '</div>';

    document.body.appendChild(d);

    d.querySelector(".ar-search-modal-close").addEventListener("click", function(){ d.close(); });

    // Click outside closes
    d.addEventListener("click", function(ev){
      var rect = d.getBoundingClientRect();
      var inDialog = (
        ev.clientX >= rect.left && ev.clientX <= rect.right &&
        ev.clientY >= rect.top  && ev.clientY <= rect.bottom
      );
      if (!inDialog) d.close();
    });

    // Lock/unlock background scroll
    d.addEventListener("close", function(){
      document.documentElement.classList.remove("ar-modal-open");
      document.body.classList.remove("ar-modal-open");
      try {
        var root = document.getElementById(ROOT_ID);
        if (root && window.ARSiteSearch && typeof window.ARSiteSearch.unmount === "function") {
          window.ARSiteSearch.unmount(root);
        } else if (root) {
          root.innerHTML = "";
        }
      } catch(e){}
    });

    return d;
  }

  function parseQueryFromHref(href){
    try {
      var u = new URL(href, window.location.origin);
      return (u.searchParams.get("q") || "").trim();
    } catch(e){ return ""; }
  }

  function openSearchModal(initialQuery){
    loadCssOnce();
    loadJsOnce(function(err){
      var dlg = ensureModal();
      var root = document.getElementById(ROOT_ID);

      // Open modal + lock scroll
      if (typeof dlg.showModal === "function") {
        dlg.showModal();
        document.documentElement.classList.add("ar-modal-open");
        document.body.classList.add("ar-modal-open");
      } else {
        window.location.href = "/site-search-results" + (initialQuery ? ("?q="+encodeURIComponent(initialQuery)) : "");
        return;
      }

      if (err || !root || !window.ARSiteSearch || typeof window.ARSiteSearch.mount !== "function") {
        // visible error inside modal
        root.innerHTML =
          '<div style="padding:12px 2px;color:#0f172a;">' +
            '<div style="font-weight:800;margin-bottom:6px;">Search failed to load.</div>' +
            '<div style="font-size:12px;color:#64748b;">' + (err ? String(err.message || err) : "ARSiteSearch.mount not available") + '</div>' +
          '</div>';
        return;
      }

      // Fresh mount each open
      if (typeof window.ARSiteSearch.unmount === "function") window.ARSiteSearch.unmount(root);
      root.innerHTML = "";

      window.ARSiteSearch.mount(root, {
        initialQuery: initialQuery || "",
        autoSearch: true,
        autoFocus: !initialQuery,
        updateUrl: false
      });
    });
  }

  function isSearchResultsLink(a){
    var href = (a && a.getAttribute) ? (a.getAttribute("href") || "") : "";
    if (!href) return false;
    try {
      var u = new URL(href, window.location.origin);
      return (u.pathname === "/site-search-results" || u.pathname === "/site-search-results/");
    } catch(e){
      return href === "site-search-results" || href === "site-search-results/" || href.indexOf("/site-search-results") === 0;
    }
  }

  // CAPTURE + stopImmediatePropagation to beat Squarespace handlers
  document.addEventListener("click", function(ev){
    var a = ev.target && ev.target.closest ? ev.target.closest("a") : null;
    if (!a) return;

    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    if (!isSearchResultsLink(a)) return;

    ev.preventDefault();
    ev.stopPropagation();
    if (typeof ev.stopImmediatePropagation === "function") ev.stopImmediatePropagation();

    openSearchModal(parseQueryFromHref(a.href || a.getAttribute("href")));
  }, true);

  // Optional: expose manual opener if needed
  window.AROpenSearchModal = openSearchModal;
})();
</script>

<script>
(function () {
  'use strict';
  function manualToggle(e) {
    var btn = e.currentTarget;
    var item = btn.closest('.accordion-item');
    if (!item) return;
    var dd = item.querySelector('.accordion-item__dropdown');
    if (!dd) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var container = item.closest('.accordion-items-container');
    var allowMulti = container && container.getAttribute('data-should-allow-multiple-open-items') === 'true';
    var open = item.getAttribute('data-is-open') === 'true';
    if (!allowMulti && !open) {
      container.querySelectorAll('.accordion-item[data-is-open="true"]').forEach(function (other) {
        if (other === item) return;
        var ob = other.querySelector('.accordion-item__click-target');
        var od = other.querySelector('.accordion-item__dropdown');
        other.removeAttribute('data-is-open');
        if (ob) ob.setAttribute('aria-expanded', 'false');
        if (od) { od.classList.remove('accordion-item__dropdown--open'); od.style.removeProperty('height'); }
      });
    }
    if (open) {
      item.removeAttribute('data-is-open');
      btn.setAttribute('aria-expanded', 'false');
      dd.classList.remove('accordion-item__dropdown--open');
      dd.style.removeProperty('height');
    } else {
      item.setAttribute('data-is-open', 'true');
      btn.setAttribute('aria-expanded', 'true');
      dd.classList.add('accordion-item__dropdown--open');
      dd.style.removeProperty('height');
    }
  }
  function wire() {
    document.querySelectorAll('.sqs-block-accordion .accordion-item__click-target').forEach(function (btn) {
      if (btn.__arManualAcc) return;
      btn.__arManualAcc = true;
      btn.addEventListener('click', manualToggle, true);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
  window.addEventListener('load', wire);
  [800, 2000, 4000, 8000].forEach(function (ms) { setTimeout(wire, ms); });
})();
</script>
